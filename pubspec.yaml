name: iptv_player
publish_to: "none"

environment:
  sdk: ^3.12.2

# `crypto` es la única dependencia real del root: la usa
# tool/fetch_fixtures.dart (T1.1) para verificar SHA-256 de los golden
# files grandes que no se commitean. BSD-3 (permisiva, P8), del propio
# equipo de Dart — sin conflicto de resolución con el resto del workspace.
dependencies:
  crypto: ^3.0.6

# Dart native workspace (SDK >= 3.6): resolución compartida de dependencias
# entre todos los paquetes del monorepo. Cada miembro declara
# `resolution: workspace` en su propio pubspec.yaml.
#
# `packages/data` queda deliberadamente FUERA (T1.5): drift_dev no
# resuelve en la misma resolución compartida que `melos` (cli_util),
# y downgradear melos no es viable (exige estar en este pubspec desde
# la v3.0.0; solo ≤2.9.0 no lo exige, y esa versión no activa bajo el
# Dart SDK actual). `packages/data` tiene su propio pubspec.lock
# independiente y su propio paso en CI (ver ci.yml) — no pasa por
# `melos bootstrap`/`run analyze`/`run test`.
#
# El spike descartable de S3 · Spike de escritorio (libmpv vs libVLC, ver
# docs/bench/S3-desktop-spike.md) nunca estuvo en este array — se aisló desde
# su creación por el mismo motivo que packages/data, sin garantías de calidad
# ni de vida más allá del sprint. Al cerrar S3 (2026-08-01) se archivó en
# docs/spikes/player_spike-archive/ (ver su README.md); no se promueve nunca
# a este array, ni siquiera archivado.
workspace:
  - packages/core
  - packages/protocols
  - packages/player
  - packages/pairing
  - packages/tokens
  - apps/app

dev_dependencies:
  melos: ^8.2.2

melos:
  name: iptv_player

  command:
    bootstrap:
      runPubGetInParallel: true

  scripts:
    analyze:
      name: Analizar
      description: flutter analyze en todos los paquetes del monorepo.
      exec:
        command: dart analyze --fatal-infos .
        concurrency: 4

    test:
      name: Test
      description: Tests de todos los paquetes (dart test en los puros, flutter test en el resto).
      run: melos run test:dart && melos run test:flutter

    test:dart:
      description: Tests de los paquetes Dart puros (core, protocols).
      exec:
        command: dart test
        concurrency: 4
      packageFilters:
        flutter: false

    test:flutter:
      description: Tests de los paquetes/apps Flutter.
      exec:
        command: flutter test
        concurrency: 4
      packageFilters:
        flutter: true

    format:
      name: Formatear
      description: dart format en todos los paquetes.
      exec:
        command: dart format --set-exit-if-changed .
        concurrency: 4
