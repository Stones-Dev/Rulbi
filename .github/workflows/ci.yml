name: CI

# T0.5 (Sprint 0): matrix Windows/Linux/Android — analyze + test.
# iOS y webOS quedan fuera deliberadamente: iOS es v1.1 (sin Mac disponible),
# webOS entra en su fase (F4, semana 13) cuando exista el toolchain flutter-webos.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FLUTTER_CHANNEL: stable

jobs:
  analyze-and-test:
    name: Analyze + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias del sistema (Linux desktop)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Activar Melos
        run: dart pub global activate melos

      - name: melos bootstrap
        run: melos bootstrap

      - name: flutter analyze (fatal-infos)
        run: melos run analyze

      - name: Tests
        run: melos run test

  android-build:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Activar Melos
        run: dart pub global activate melos

      - name: melos bootstrap
        run: melos bootstrap

      - name: Build APK (debug)
        working-directory: apps/app
        run: flutter build apk --debug
