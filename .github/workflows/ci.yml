name: CI

# T0.5 (Sprint 0): matrix Windows/Linux/Android — analyze + test.
# iOS y webOS quedan fuera deliberadamente: iOS es v1.1 (sin Mac disponible),
# webOS entra en su fase (F4, semana 13) cuando exista el toolchain flutter-webos.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FLUTTER_CHANNEL: stable

jobs:
  analyze-and-test:
    name: Analyze + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      # `libmpv-dev` (S6): packages/player depende de media_kit desde esta
      # ola (ADR-009). Hallazgo real del spike de S3 (C4,
      # docs/bench/S3-desktop-spike.md): el primer intento de compilar el
      # spike en ubuntu-latest falló por `PkgConfig::mpv` no encontrado —
      # es dependencia de *build* en Linux, no solo de runtime (el spike
      # README ya avisaba de que este paso lo necesitaría al llegar S6).
      - name: Instalar dependencias del sistema (Linux desktop)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config libmpv-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Activar Melos
        run: dart pub global activate melos

      - name: melos bootstrap
        run: melos bootstrap

      # packages/data queda fuera del workspace Dart raíz (T1.5): drift_dev
      # no resuelve junto a melos bajo el flutter_test del SDK actual (ver
      # pubspec.yaml raíz). Tiene su propio pubspec.lock y su propio paso
      # aquí, en vez de por `melos bootstrap`/`run analyze`/`run test`.
      #
      # Estos dos pasos van ANTES de `melos run analyze` (ADR-007): desde
      # que `apps/app` depende (dev-only) de `iptv_data` para su
      # `integration_test/`, `dart analyze --fatal-infos .` sobre `apps/app`
      # necesita `database.g.dart` — generado aquí, no comiteado
      # (`*.g.dart` en `.gitignore`).
      - name: packages/data — pub get
        working-directory: packages/data
        run: flutter pub get

      - name: packages/data — codegen (drift)
        working-directory: packages/data
        run: dart run build_runner build --delete-conflicting-outputs

      # D4 (i18n base, S4): AppLocalizations no se commitea (mismo criterio
      # que database.g.dart arriba, ver .gitignore raíz) — se regenera aquí,
      # antes de `melos run analyze`, o dart analyze sobre apps/app falla al
      # no encontrar lib/l10n/app_localizations.dart.
      - name: apps/app — codegen (flutter gen-l10n)
        working-directory: apps/app
        run: flutter gen-l10n

      - name: flutter analyze (fatal-infos)
        run: melos run analyze

      - name: Tests
        run: melos run test

      - name: packages/data — analyze (fatal-infos)
        working-directory: packages/data
        run: dart analyze --fatal-infos .

      - name: packages/data — tests
        working-directory: packages/data
        run: flutter test

  android-build:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Activar Melos
        run: dart pub global activate melos

      - name: melos bootstrap
        run: melos bootstrap

      # S4 · Ola 2: iptv_data pasó de dev-only a dependency real de
      # apps/app (Formulario Xtream persiste de verdad) — este job compila
      # la app entera, así que ahora también necesita database.g.dart
      # generado, igual que ya hacían los otros dos jobs (mismo motivo que
      # ADR-007 documentó para "Android integration").
      - name: packages/data — pub get
        working-directory: packages/data
        run: flutter pub get

      - name: packages/data — codegen (drift)
        working-directory: packages/data
        run: dart run build_runner build --delete-conflicting-outputs

      - name: apps/app — codegen (flutter gen-l10n)
        working-directory: apps/app
        run: flutter gen-l10n

      - name: Build APK (debug)
        working-directory: apps/app
        run: flutter build apk --debug

  # S4 · Ola 3: gap de cobertura de CI detectado en Ola 2 — el job
  # "Analyze + test (windows-latest)" de arriba solo corre analyze/test en
  # modo host, nunca compila el ejecutable nativo de Windows. Por eso el
  # fallo real de `flutter_secure_storage_windows` (falta el componente
  # "C++ ATL for latest build tools" de Visual Studio Build Tools) no lo
  # detectó CI en la sesión de Ola 2 — solo apareció al intentar
  # `flutter build windows`/`flutter run -d windows` en local. Este job
  # cierra ese hueco para cualquier dependencia con código C++ nativo
  # (flutter_secure_storage_windows hoy, media_kit en S6). Job aparte, sin
  # `needs:` — no comparte artefactos con los otros, mismo criterio que
  # "Android integration" de abajo.
  windows-build:
    name: Windows debug build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Activar Melos
        run: dart pub global activate melos

      - name: melos bootstrap
        run: melos bootstrap

      # Mismo motivo que en "Android debug build": iptv_data pasó a
      # dependency real de apps/app en S4 · Ola 2, así que compilar la app
      # entera necesita database.g.dart generado.
      - name: packages/data — pub get
        working-directory: packages/data
        run: flutter pub get

      - name: packages/data — codegen (drift)
        working-directory: packages/data
        run: dart run build_runner build --delete-conflicting-outputs

      - name: apps/app — codegen (flutter gen-l10n)
        working-directory: apps/app
        run: flutter gen-l10n

      - name: Build Windows (debug)
        working-directory: apps/app
        run: flutter build windows --debug

  # ADR-007: verificación de migraciones drift en runtime Android real
  # (emulador, no host) — cierra la deuda residual de T1.5a. Cinco
  # parámetros fijados por el ADR: alcance A+B, API 33/google_apis/x86_64,
  # ubuntu-latest con KVM, cada push a main, apps/app/integration_test/.
  #
  # Job aparte (no `needs:` de los otros dos): no comparte artefactos con
  # ellos (cada uno tiene su propio checkout/caché de Flutter), así que
  # encadenarlos sólo añadiría minutos de reloj de pared sin ahorrar nada.
  android-integration:
    name: Android integration (drift v1->v4, API 33)
    runs-on: ubuntu-latest
    # ADR-007 parámetro 4: cada push a main. No en pull_request todavía
    # (revisitar en S6 si el proyecto adopta gate sobre PR).
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      # La primera corrida real (2026-07-31, run 30634198005) tumbó el
      # emulador con "FATAL | Not enough space to create userdata
      # partition. Available: 2819.48 MB, need 7372.80 MB" -- el runner
      # `ubuntu-latest` trae preinstalados varios SDKs grandes que no usa
      # este job (dotnet, GHC, CodeQL) y dejan muy poco margen libre para
      # el AVD. Liberar esto (no es un problema de KVM/aceleración, el
      # log lo confirma: el proceso del emulador muere antes de arrancar).
      - name: Liberar espacio en disco (el AVD necesita ~7 GB de partición userdata)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Activar Melos
        run: dart pub global activate melos

      - name: melos bootstrap
        run: melos bootstrap

      # apps/app depende (dev-only) de iptv_data para su integration_test/
      # (ADR-007, ADR-004 intacto: drift_dev no sale del workspace).
      # database.g.dart no está comiteado — hace falta generarlo antes de
      # que `flutter test integration_test` pueda compilar `apps/app`.
      - name: packages/data — pub get
        working-directory: packages/data
        run: flutter pub get

      - name: packages/data — codegen (drift)
        working-directory: packages/data
        run: dart run build_runner build --delete-conflicting-outputs

      # D4 (i18n base, S4): apps/app ahora importa lib/l10n/app_localizations.dart
      # (no commiteado) desde main.dart/desktop_shell.dart — sin este paso,
      # `flutter test integration_test` no compila.
      - name: apps/app — codegen (flutter gen-l10n)
        working-directory: apps/app
        run: flutter gen-l10n

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Caché del AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-33-google_apis-x86_64

      - name: Generar snapshot del AVD (sólo en cache miss)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          disable-linux-hw-accel: false
          script: echo "AVD snapshot generado"

      - name: integration_test (migración drift v1->v4)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 300
          working-directory: apps/app
          script: flutter test integration_test
