name: iptv_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # D4 (idiomas v1: es + en, plan.md rev. 1.4). flutter_localizations es
  # parte del SDK (Apache-2.0); intl es BSD-3 — ninguna compromete P8.
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  animations: ^2.0.11
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17

  iptv_tokens: any

  # `iptv_core` ya es miembro del workspace compartido (`packages/core` en
  # el `workspace:` del pubspec raíz) — se referencia sin `path:` explícito,
  # igual que `iptv_tokens`. Entidades de dominio (`Source`, `SourceConfig`)
  # que construyen los formularios de S4 · Ola 2.
  iptv_core: any

  # Parsers M3U/Xtream (mismo criterio de workspace que `iptv_core`) — el
  # botón "Probar" de ambos formularios reutiliza `parseM3u`/`XtreamClient`,
  # nunca reimplementa nada de `packages/protocols` (P6).
  iptv_protocols: any

  # ADR-007 (verificación de migraciones drift en Android runtime): sólo
  # las `dependencies` de un path-dependency entran en la resolución
  # compartida del workspace, nunca sus `dev_dependencies` — así que esto
  # arrastra `drift`/`drift_flutter` (+ sqlite3_flutter_libs/path_provider),
  # pero NO `drift_dev`/`build_runner`, que es lo que ADR-004 sacó del
  # workspace por conflicto real con `melos` (`analyzer`/`cli_util`).
  # Verificado empíricamente (T-Android-drift): `flutter pub get` aquí no
  # cambia ninguna versión ya comiteada de otra dependencia del workspace.
  # **Real dependency desde S4 · Ola 2** (Formulario Xtream): el guardado de
  # una fuente ya persiste de verdad vía `DriftSourceRepository` +
  # `FlutterSecureCredentialStore` — dejó de ser dev-only.
  iptv_data:
    path: ../../packages/data

  # Selector de archivo nativo (ui-spec §2.8, origen "Archivo" del
  # Formulario M3U): soporta Windows/Linux/Android. MIT (P8 ok).
  file_picker: ^8.1.7

  # Id de `Source` al crearla. Ya resolvía como transitiva (pubspec.lock
  # raíz) — declararla aquí no mueve ninguna versión. MIT (P8 ok).
  uuid: any

  # GET de muestra del "Probar" del Formulario M3U (`m3u_probe.dart`). Ya
  # resolvía como transitiva vía `iptv_protocols` (mismo criterio que en su
  # pubspec: no mueve versión). BSD-3 (P8 ok).
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Tests unitarios de los probes de `features/sources/` (S4 · Ola 2) no
  # tocan widgets — `package:test` puro es más ligero que `flutter_test`
  # para ellos. Ya resolvía como transitiva de `flutter_test`; declararla
  # aquí no mueve ninguna versión.
  test: any

  # Import directo de `package:drift/drift.dart` en el test de migración
  # (operadores de `Expression<bool>`, `NativeDatabase`) — declarada
  # explícita para no depender en silencio de una transitiva de
  # `iptv_data`/`drift_flutter` (`depend_on_referenced_packages`). Misma
  # versión que resuelve `packages/data` (2.34.3).
  drift: ^2.34.3

  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # D4 (i18n base, S4). Config completa en l10n.yaml (arb-dir, clase de
  # salida AppLocalizations). El código generado no se commitea — ver
  # regla en .gitignore raíz y el paso `flutter gen-l10n` en ci.yml.
  generate: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
