name: iptv_playback
description: Implementaciones de PlayerPort por plataforma (media3, libmpv/libVLC, webOS). Único paquete con permiso de importar SDKs de reproducción nativos (P6).
version: 0.0.1
publish_to: "none"

environment:
  sdk: ^3.12.2
  flutter: ">=1.17.0"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  iptv_core:
    path: ../core

  # Motor de escritorio decidido en S3 · Spike de escritorio (ADR-009):
  # libmpv en modo LGPL (`-Dgpl=false`), no GPL — verificado contra el
  # build real que empaqueta media_kit_libs_windows_video/_linux (ver
  # docs/bench/S3-desktop-spike.md). Mismas versiones que el spike
  # archivado (docs/spikes/player_spike-archive/), cuyo código no se
  # reutiliza — esta implementación de MediaKitPlayer empieza desde cero.
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_windows_video: ^1.0.11
  media_kit_libs_linux: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
