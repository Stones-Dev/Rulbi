include: ../../analysis_options.yaml

analyzer:
  exclude:
    # Generado por `drift_dev schema generate` (T1.6b, arnés de migración
    # v1 -> v2): código de verificación de esquema, no de producción — no
    # se toca a mano ("DO NOT MODIFY" en su cabecera) y no vale la pena
    # limpiar sus warnings de `strict-raw-types` (TableInfo sin argumentos
    # de tipo explícitos, propio de cómo drift_dev genera este código).
    # Movido de `test/generated_migrations/` a `lib/src/testing/` en
    # ADR-007 para que `apps/app/integration_test/` pueda reutilizarlo
    # vía `package:iptv_data/testing.dart` — ver ese barrel.
    - "lib/src/testing/generated_migrations/**"
