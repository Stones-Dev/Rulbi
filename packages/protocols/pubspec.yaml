name: iptv_protocols
description: Parsers M3U/XMLTV en streaming y cliente Xtream. Sin Flutter.
version: 0.0.1
publish_to: "none"

environment:
  sdk: ^3.12.2
resolution: workspace

dependencies:
  iptv_core:
    path: ../core
  # T1.3: motor SAX en streaming para el parser XMLTV (chunked
  # toXmlEvents()). MIT (P8 ok). Ya resuelto en el pubspec.lock del
  # workspace como dependencia transitiva en 7.0.1 — declararlo aquí no
  # mueve ninguna versión (a diferencia del conflicto melos/drift_dev de
  # ADR-004).
  xml: ^7.0.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
